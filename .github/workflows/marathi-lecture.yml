name: Marathi Lecture 24/7 Stream

# One of 4 independent streams in this repo — see scripts/stream-loop.sh
# for why each job self-restarts every 6 hours. Cron staggered a few
# minutes from the other 3 workflows so they don't all hit GitHub's
# scheduler queue at the exact same instant.

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch: {}

concurrency:
  group: marathi-lecture-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Stream loop to YouTube
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY_MARATHI }}
          VIDEO_DIR: videos/marathi-lecture
          JOB_BUDGET_SECONDS: '21000'
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then
            echo "::error::YT_STREAM_KEY_MARATHI secret is not set."
            exit 1
          fi
          chmod +x scripts/stream-loop.sh
          scripts/stream-loop.sh
