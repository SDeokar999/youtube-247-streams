name: Hanuman Chalisa 24/7 Stream

on:
  schedule:
    - cron: '15 */6 * * *'   # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch: {}

concurrency:
  group: hanuman-chalisa-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Stream loop to YouTube
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY_HANUMAN }}
          VIDEO_DIR: videos/hanuman-chalisa
          JOB_BUDGET_SECONDS: '21000'
          BLOCK_SECONDS: '60'   # TEST value — bump to 3600 (1hr) once confirmed working
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then
            echo "::error::YT_STREAM_KEY_HANUMAN secret is not set."
            exit 1
          fi
          chmod +x scripts/stream-loop.sh
          scripts/stream-loop.sh
