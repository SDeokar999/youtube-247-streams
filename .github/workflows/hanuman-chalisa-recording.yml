name: Hanuman Chalisa Recording 24/7 Stream

on:
  schedule:
    - cron: '20 */6 * * *'   # 00:20, 06:20, 12:20, 18:20 UTC
  workflow_dispatch: {}

concurrency:
  group: hanuman-chalisa-recording-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ffmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi

      - name: Stream loop to YouTube
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY_HANUMAN_RECORDING }}
          VIDEO_DIR: videos/hanuman-chalisa-recording
          JOB_BUDGET_SECONDS: '21000'
        run: |
          if [ -z "$YT_STREAM_KEY" ]; then
            echo "::error::YT_STREAM_KEY_HANUMAN_RECORDING secret is not set."
            exit 1
          fi
          chmod +x scripts/stream-loop.sh
          scripts/stream-loop.sh
